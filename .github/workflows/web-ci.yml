name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
